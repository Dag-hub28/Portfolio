<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="c"><circle cx="300" cy="300" r="300"/></clipPath>
  </defs>
  <rect width="600" height="600" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="600" height="600" fill="rgba(0,0,0,0.12)"/>
    <g transform="translate(150,140)">
      <circle cx="150" cy="100" r="85" fill="#021124" opacity="0.12"/>
      <rect x="0" y="220" width="300" height="40" rx="20" fill="#021124" opacity="0.12"/>
      <rect x="40" y="270" width="220" height="16" rx="8" fill="#021124" opacity="0.08"/>
    </g>
  </g>
  <text x="50%" y="95%" font-family="Inter, Arial, sans-serif" font-size="20" fill="#dbeafe" text-anchor="middle">Replace assets/hero.svg with your photo</text>
</svg>